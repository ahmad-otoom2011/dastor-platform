<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الاختبار — منصة دستور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="quiz-body">

  <header class="quiz-topbar">
    <div class="container">
      <a href="/" class="logo" aria-label="منصة دستور">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs><linearGradient id="lg1" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#4C6EF5"/><stop offset="1" stop-color="#3B5BDB"/></linearGradient></defs>
          <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#lg1)"/>
          <path d="M11 31.5c4.6-2.4 9.4-2.4 13 0v6.2c-3.6-2.4-8.4-2.4-13 0v-6.2Z" fill="#fff" opacity=".95"/>
          <path d="M24 31.5c4.6-2.4 9.4-2.4 13 0v6.2c-3.6-2.4-8.4-2.4-13 0v-6.2Z" fill="#fff" opacity=".75"/>
          <path d="M24 9.5 12.5 15.4 24 21.3l11.5-5.9L24 9.5Z" fill="#FFD98E"/>
          <path d="M33 17.6v6.6c0 1.9-4 3.4-9 3.4s-9-1.5-9-3.4v-6.6" stroke="#FFD98E" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="logo-text">د<b>ستور</b></span>
      </a>
      <a href="/dashboard" class="btn btn-outline btn-sm">العودة للوحة الطالب</a>
    </div>
  </header>

  <main class="container quiz-stage">
    <!-- تحميل -->
    <div id="quizLoading" class="loading-box">
      <div class="spinner"></div>
      <p>جارٍ تحميل الاختبار...</p>
    </div>

    <!-- خطأ -->
    <div id="quizError" class="alert alert-error show" style="max-width:640px;margin:40px auto;display:none;"></div>

    <!-- بطاقة الاختبار -->
    <section class="quiz-card" id="quizCard" hidden>
      <h1 id="quizTitle">—</h1>
      <p class="quiz-desc" id="quizDesc"></p>

      <div class="progress-head">
        <span class="q-counter" id="progressText">السؤال 1 من 1</span>
        <span id="answeredText">0 إجابة مُختارة</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

      <p class="question-text" id="questionText">—</p>
      <div class="options-list" id="optionsList"></div>

      <div class="quiz-nav">
        <div class="nav-side">
          <button class="btn btn-outline" id="prevBtn" disabled>السابق</button>
        </div>
        <div class="nav-side">
          <button class="btn btn-primary" id="nextBtn">التالي</button>
          <button class="btn btn-green" id="submitBtn" hidden>إرسال الإجابات</button>
        </div>
      </div>
    </section>

    <!-- شاشة النتيجة -->
    <section class="quiz-card" id="resultCard" hidden>
      <div class="result-box">
        <div class="result-ring">
          <svg viewBox="0 0 160 160" aria-hidden="true">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4C6EF5"/><stop offset="1" stop-color="#10B981"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="80" cy="80" r="65"/>
            <circle class="ring-fg" id="ringFg" cx="80" cy="80" r="65"/>
          </svg>
          <div class="ring-center">
            <span class="ring-pct" id="ringPct">0٪</span>
            <span class="ring-label">نسبة النجاح</span>
          </div>
        </div>

        <h2 class="result-title" id="resultTitle">أحسنت!</h2>
        <p class="result-msg" id="resultMsg"></p>

        <div class="result-breakdown">
          <div class="rb"><b id="rbScore">0 / 0</b><span>درجتك</span></div>
          <div class="rb"><b id="rbCorrect">0</b><span>إجابة صحيحة</span></div>
          <div class="rb"><b id="rbWrong">0</b><span>إجابة خاطئة</span></div>
        </div>

        <div class="result-actions">
          <a href="/dashboard" class="btn btn-primary">العودة للوحة</a>
          <button class="btn btn-outline" id="retryBtn">إعادة المحاولة</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/quiz.js"></script>
</body>
</html>
