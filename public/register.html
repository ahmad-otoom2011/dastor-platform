<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب — منصة دستور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-body">

  <main class="auth-card">
    <a href="/" class="logo" aria-label="العودة للرئيسية">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
        <defs><linearGradient id="lg1" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#4C6EF5"/><stop offset="1" stop-color="#3B5BDB"/></linearGradient></defs>
        <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#lg1)"/>
        <path d="M11 31.5c4.6-2.4 9.4-2.4 13 0v6.2c-3.6-2.4-8.4-2.4-13 0v-6.2Z" fill="#fff" opacity=".95"/>
        <path d="M24 31.5c4.6-2.4 9.4-2.4 13 0v6.2c-3.6-2.4-8.4-2.4-13 0v-6.2Z" fill="#fff" opacity=".75"/>
        <path d="M24 9.5 12.5 15.4 24 21.3l11.5-5.9L24 9.5Z" fill="#FFD98E"/>
        <path d="M33 17.6v6.6c0 1.9-4 3.4-9 3.4s-9-1.5-9-3.4v-6.6" stroke="#FFD98E" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M36.6 16.2v7.6" stroke="#FFD98E" stroke-width="2" stroke-linecap="round"/>
        <circle cx="36.6" cy="25.6" r="1.7" fill="#FFD98E"/>
      </svg>
      <span class="logo-text">د<b>ستور</b></span>
    </a>

    <h1>أنشئ حسابك المجاني</h1>
    <p class="auth-sub">دقيقة واحدة… وابدأ رحلتك التعليمية مع دستور</p>

    <div class="alert alert-error" id="formError" role="alert"></div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="name">الاسم الكامل</label>
        <input type="text" id="name" class="form-control" placeholder="اكتب اسمك الكامل" autocomplete="name" required />
      </div>
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" class="form-control" placeholder="٦ خانات على الأقل" autocomplete="new-password" minlength="6" required />
      </div>
      <div class="form-group">
        <label for="grade">الصف الدراسي</label>
        <select id="grade" class="form-control" required>
          <option value="" disabled selected>اختر صفك الدراسي</option>
          <option value="1">الصف الأول</option>
          <option value="2">الصف الثاني</option>
          <option value="3">الصف الثالث</option>
          <option value="4">الصف الرابع</option>
          <option value="5">الصف الخامس</option>
          <option value="6">الصف السادس</option>
          <option value="7">الصف السابع</option>
          <option value="8">الصف الثامن</option>
          <option value="9">الصف التاسع</option>
          <option value="10">الصف العاشر</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">إنشاء الحساب</button>
    </form>

    <p class="auth-alt">لديك حساب بالفعل؟ <a href="/login">سجّل دخولك</a></p>
    <p class="auth-note">اختر صفك الدراسي ليُعرض لك الاختبارات المخصّصة لمجموعتك تلقائياً.</p>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
